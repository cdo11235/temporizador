<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temporizador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Temporizador</title>
<style>
:root{color-scheme:dark;--green:#00FF00;--yellow:#FFFF00;--red:#FF0000;--accent:#00FF00}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;overscroll-behavior:none}button,input{font:inherit}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));gap:12px}
header{width:100%;display:flex;align-items:center;justify-content:space-between;max-width:900px;gap:10px}
header .name{font-size:13px;color:#8a8a8a;letter-spacing:.06em;text-transform:uppercase}
#settingsBtn{background:#191919;border:1px solid #555;color:white;border-radius:12px;padding:11px 14px;cursor:pointer}
.display{display:flex;justify-content:center;align-items:center;flex:1;width:100%;min-height:100px;overflow:hidden}
#clock{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.045em;white-space:nowrap;color:var(--accent);line-height:1;font-size:clamp(48px,24vw,240px);user-select:none;-webkit-user-select:none}
footer{width:100%;max-width:700px;display:flex;align-items:center;gap:10px}
footer button{min-height:54px;border-radius:14px;border:1px solid #444;background:#191919;color:#fff;cursor:pointer;flex:1;font-size:16px;font-weight:650}
footer #startBtn{border-color:#777;background:#333}
button:active{filter:brightness(1.35)}
dialog{background:#141414;color:#fff;border:1px solid #666;border-radius:18px;width:min(92vw,430px);padding:22px;box-shadow:0 0 0 100vmax #000b}
dialog::backdrop{background:#000b}h2{margin:0 0 20px;font-size:22px}
label{display:block;font-size:15px;margin:15px 0 7px;color:#ddd}
input[type=number],input[type=time]{display:block;width:100%;background:#242424;border:1px solid #666;color:#fff;padding:12px;border-radius:10px;font-size:18px}
input[type=range]{width:100%;accent-color:#00ff00}
.small{color:#aaa;font-size:13px;line-height:1.4;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:23px}.actions button{flex:1;padding:13px;border-radius:10px;background:#333;border:1px solid #555;color:#fff}.actions .save{background:#eaeaea;color:#000}
@media(orientation:landscape){main{padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));gap:0}header .name{font-size:11px}#settingsBtn{padding:7px 12px}footer button{min-height:39px;font-size:13px}footer{max-width:480px}#clock{font-size:clamp(42px,34vh,260px)}}
</style>
</head>
<body>
<main>
<header><span class="name" id="status">Listo</span><button id="settingsBtn" type="button" aria-label="Abrir configuración">Configurar</button></header>
<div class="display"><div id="clock" role="timer" aria-live="off">05:00</div></div>
<footer><button id="startBtn" type="button">Iniciar</button><button id="resetBtn" type="button">Reiniciar</button></footer>
</main>
<dialog id="settings">
<form method="dialog" id="settingsForm">
<h2>Configuración</h2>
<label for="minutes">Duración inicial (minutos)</label><input id="minutes" type="number" min="0" max="9999" step="1" inputmode="numeric" required>
<label for="seconds">Segundos (0–59)</label><input id="seconds" type="number" min="0" max="59" step="1" inputmode="numeric" required>
<label for="threshold">Cambiar a amarillo al <strong id="thresholdValue">75 %</strong> del tiempo transcurrido</label>
<input id="threshold" type="range" min="1" max="100" step="1" value="75">
<label for="size">Tamaño de los números: <strong id="sizeValue">100 %</strong></label>
<input id="size" type="range" min="50" max="150" step="5" value="100">
<p class="small">Al llegar a 00:00, el reloj continúa contando hacia adelante en rojo. Guardar reinicia el tiempo.</p>
<div class="actions"><button type="button" id="cancelBtn">Cancelar</button><button type="submit" class="save">Guardar</button></div>
</form>
</dialog>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), clock=$('clock'),status=$('status'),start=$('startBtn');
const defaults={duration:300,threshold:75,size:100};let conf={...defaults};
try{const stored=JSON.parse(localStorage.getItem('temporizador-config')||'{}');
if(Number.isInteger(stored.duration)&&stored.duration>0&&stored.duration<=599999&&Number.isInteger(stored.threshold)&&stored.threshold>=1&&stored.threshold<=100&&Number.isInteger(stored.size)&&stored.size>=50&&stored.size<=150) conf=stored;}catch(e){}
let remainingMs=conf.duration*1000, running=false, deadline=0;
function fmt(seconds){const abs=Math.max(0,Math.floor(Math.abs(seconds)));return String(Math.floor(abs/60)).padStart(2,'0')+':'+String(abs%60).padStart(2,'0');}
function remaining(){return running?deadline-performance.now():remainingMs;}
function render(){let ms=remaining();let overtime=ms<=0;
// El color amarillo se activa cuando se ha consumido el porcentaje configurado.
const passed=100-Math.max(0,ms)/(conf.duration*1000)*100;
const c=overtime?'#FF0000':passed>=conf.threshold?'#FFFF00':'#00FF00';
clock.style.color=c;clock.textContent=fmt(overtime?Math.abs(ms)/1000:Math.ceil(ms/1000));
status.textContent=overtime?'Tiempo extra':running?'En curso':(remainingMs===conf.duration*1000?'Listo':'En pausa');
start.textContent=running?'Pausar':'Iniciar';fit();}
function fit(){// Ajusta el texto para evitar que se corte, respetando el control de tamaño.
const area=document.querySelector('.display');const availableWidth=area.clientWidth-4;const availableHeight=area.clientHeight-4;
if(availableWidth<=0||availableHeight<=0)return;
const base=Math.min(availableHeight*.88,availableWidth/5.3);
clock.style.fontSize=Math.max(24,base*conf.size/100)+'px';
// Medida real para evitar desbordes en pantallas con fuentes distintas.
if(clock.scrollWidth>availableWidth){const actual=parseFloat(clock.style.fontSize);clock.style.fontSize=actual*(availableWidth/clock.scrollWidth)+'px';}
}
function tick(){if(running)render();requestAnimationFrame(tick);}
function toggle(){if(running){remainingMs=deadline-performance.now();running=false;}else{deadline=performance.now()+remainingMs;running=true;requestWake();}render();}
function reset(){running=false;remainingMs=conf.duration*1000;render();}
let wakeLock=null;
async function requestWake(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible')return;try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')requestWake();render();});
start.addEventListener('click',toggle);$('resetBtn').addEventListener('click',reset);
function openSettings(){if(running){remainingMs=deadline-performance.now();running=false;}
$('minutes').value=Math.floor(conf.duration/60);$('seconds').value=conf.duration%60;
$('threshold').value=conf.threshold;$('size').value=conf.size;labels();$('settings').showModal();render();}
function labels(){$('thresholdValue').textContent=$('threshold').value+' %';$('sizeValue').textContent=$('size').value+' %';}
$('settingsBtn').addEventListener('click',openSettings);$('threshold').addEventListener('input',labels);$('size').addEventListener('input',labels);
$('cancelBtn').addEventListener('click',()=>$('settings').close());
$('settingsForm').addEventListener('submit',e=>{e.preventDefault();const min=Number($('minutes').value),sec=Number($('seconds').value);if(!Number.isInteger(min)||!Number.isInteger(sec)||min<0||min>9999||sec<0||sec>59||min*60+sec<1){alert('Indica una duración de al menos un segundo.');return;}
conf={duration:min*60+sec,threshold:Number($('threshold').value),size:Number($('size').value)};
localStorage.setItem('temporizador-config',JSON.stringify(conf));$('settings').close();reset();});
window.addEventListener('resize',fit);document.addEventListener('keydown',e=>{if($('settings').open)return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.key.toLowerCase()==='r')reset();});
render();requestAnimationFrame(tick);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
